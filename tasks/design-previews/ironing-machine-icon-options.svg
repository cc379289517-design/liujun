<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#e5edf3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#314458" flood-opacity="0.16"/>
    </filter>
    <pattern id="mapGrid" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
      <path d="M0 0H34M0 0V34" stroke="#cbd5e1" stroke-opacity="0.32" stroke-width="2"/>
    </pattern>
    <style>
      .title { font: 900 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263241; }
      .sub { font: 600 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #718096; }
      .h { font: 900 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #263241; }
      .tag { font: 900 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #df4f46; }
      .body { font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526173; }
      .bubbleText { font: 900 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ef5b51; }
      .bubbleSub { font: 900 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f06a60; }
      .pinText { font: 900 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .count { font: 900 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .line { fill: none; stroke: #f05b51; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .lineSmall { fill: none; stroke: #f05b51; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .mutedLine { fill: none; stroke: #94a3b8; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
